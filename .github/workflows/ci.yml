name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK (pinned)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Show .NET Info
        run: dotnet --info

      - name: Validate Central Package Pinning
        shell: pwsh
        run: |
          $matches = Get-ChildItem -Recurse -Filter *.csproj |
            Select-String -Pattern '<PackageReference[^>]*Version='
          if ($matches) {
            $matches | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            throw "Found PackageReference entries with inline Version. Use Directory.Packages.props."
          }
          if (-not (Test-Path "Directory.Packages.props")) {
            throw "Directory.Packages.props is missing."
          }

      - name: Restore
        run: dotnet restore AgentBlazor.slnx --force-evaluate

      - name: Build
        run: dotnet build AgentBlazor.slnx -c Release --no-restore -nologo

      - name: Test
        run: dotnet test AgentBlazor.slnx -c Release --no-build -nologo

      - name: Local Package Smoke Test
        shell: pwsh
        run: |
          ./scripts/smoke-test-local-package.ps1 -PackageVersion 0.1.0-preview.5

      - name: Install E2E Dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: tests/e2e
        run: npm run install:browsers

      - name: Run E2E Tests
        working-directory: tests/e2e
        run: npm run test:e2e
