name: publish-nuget-org

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: "Package version to publish (example: 0.2.0-preview.N or 0.2.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-nuget:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK (pinned)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Validate package version format
        shell: pwsh
        run: |
          $version = "${{ inputs.package_version }}"
          if ($version -notmatch '^\d+\.\d+\.\d+([-.].+)?$') {
            throw "package_version must be a valid SemVer string such as 0.2.0-preview.N or 0.2.0"
          }

      - name: Validate Central Package Pinning
        shell: pwsh
        run: |
          $matches = Get-ChildItem -Recurse -Filter *.csproj |
            Select-String -Pattern '<PackageReference[^>]*Version='
          if ($matches) {
            $matches | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            throw "Found PackageReference entries with inline Version. Use Directory.Packages.props."
          }
          if (-not (Test-Path "Directory.Packages.props")) {
            throw "Directory.Packages.props is missing."
          }

      - name: Restore
        run: dotnet restore AgentBlazor.slnx --force-evaluate

      - name: Build
        run: dotnet build AgentBlazor.slnx -c Release --no-restore -nologo /p:Version=${{ inputs.package_version }}

      - name: Test
        run: dotnet test AgentBlazor.slnx -c Release --no-build -nologo

      - name: Restore Demo For E2E
        run: >
          dotnet restore
          demo/AgentBlazor.Demo/AgentBlazor.Demo.csproj
          --force-evaluate
          -p:RuntimeIdentifier=linux-x64

      - name: Build Demo For E2E
        run: >
          dotnet build
          demo/AgentBlazor.Demo/AgentBlazor.Demo.csproj
          -c Release
          --no-restore
          -nologo
          -p:RuntimeIdentifier=linux-x64
          /p:Version=${{ inputs.package_version }}

      - name: Install E2E Dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: tests/e2e
        run: npm run install:browsers

      - name: Run E2E Tests
        working-directory: tests/e2e
        run: npm run test:e2e

      - name: Pack and smoke test local package
        shell: pwsh
        run: |
          ./scripts/smoke-test-local-package.ps1 -Pack -PackageVersion "${{ inputs.package_version }}"

      - name: Publish runtime package to nuget.org
        run: >
          dotnet nuget push
          "src/AgentBlazor.Components/bin/Release/AgentBlazor.${{ inputs.package_version }}.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate
          --timeout 120

      - name: Publish WebAssembly client package to nuget.org
        run: >
          dotnet nuget push
          "src/AgentBlazor.Client/bin/Release/AgentBlazor.Client.${{ inputs.package_version }}.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate
          --timeout 120

      - name: Publish WebAssembly client symbols to nuget.org
        run: >
          dotnet nuget push
          "src/AgentBlazor.Client/bin/Release/AgentBlazor.Client.${{ inputs.package_version }}.snupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate
          --timeout 120

      - name: Publish Entity Framework Core package to nuget.org
        run: >
          dotnet nuget push
          "src/AgentBlazor.EntityFrameworkCore/bin/Release/AgentBlazor.EntityFrameworkCore.${{ inputs.package_version }}.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate
          --timeout 120

      - name: Publish CLI tool package to nuget.org
        run: >
          dotnet nuget push
          "src/AgentBlazor.Cli/bin/Release/AgentBlazor.Cli.${{ inputs.package_version }}.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate
          --timeout 120

      - name: Publish CLI tool symbols to nuget.org
        run: >
          dotnet nuget push
          "src/AgentBlazor.Cli/bin/Release/AgentBlazor.Cli.${{ inputs.package_version }}.snupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate
          --timeout 120

      - name: Upload published package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: agentblazor-nuget-packages-${{ inputs.package_version }}
          path: |
            src/AgentBlazor.Components/bin/Release/AgentBlazor.${{ inputs.package_version }}.nupkg
            src/AgentBlazor.Client/bin/Release/AgentBlazor.Client.${{ inputs.package_version }}.nupkg
            src/AgentBlazor.Client/bin/Release/AgentBlazor.Client.${{ inputs.package_version }}.snupkg
            src/AgentBlazor.EntityFrameworkCore/bin/Release/AgentBlazor.EntityFrameworkCore.${{ inputs.package_version }}.nupkg
            src/AgentBlazor.Cli/bin/Release/AgentBlazor.Cli.${{ inputs.package_version }}.nupkg
            src/AgentBlazor.Cli/bin/Release/AgentBlazor.Cli.${{ inputs.package_version }}.snupkg
          if-no-files-found: error
