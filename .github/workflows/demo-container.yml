name: Demo Container

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - .dockerignore
      - demo/AgentBlazor.Demo/**
      - src/AgentBlazor.Core/**
      - src/AgentBlazor.Hosting/**
      - src/AgentBlazor.Components/**
      - src/AgentBlazor.ProviderAdapters/**
      - src/AgentBlazor.Licensing/**
      - Directory.Build.props
      - Directory.Packages.props
      - NuGet.Config
      - global.json
      - .github/workflows/demo-container.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/agentblazor-demo" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
