name: publish-github-packages-preview

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: "Preview package version to publish (example: 0.1.0-preview.4)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK (pinned)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Validate package version format
        shell: pwsh
        run: |
          $version = "${{ inputs.package_version }}"
          if ($version -notmatch '^\d+\.\d+\.\d+-.+$') {
            throw "package_version must be a prerelease SemVer string like 0.1.0-preview.4"
          }

      - name: Validate Central Package Pinning
        shell: pwsh
        run: |
          $matches = Get-ChildItem -Recurse -Filter *.csproj |
            Select-String -Pattern '<PackageReference[^>]*Version='
          if ($matches) {
            $matches | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            throw "Found PackageReference entries with inline Version. Use Directory.Packages.props."
          }
          if (-not (Test-Path "Directory.Packages.props")) {
            throw "Directory.Packages.props is missing."
          }

      - name: Restore
        run: dotnet restore AgentBlazor.slnx --force-evaluate

      - name: Build
        run: dotnet build AgentBlazor.slnx -c Release --no-restore -nologo

      - name: Test
        run: dotnet test AgentBlazor.slnx -c Release --no-build -nologo

      - name: Install E2E Dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: tests/e2e
        run: npm run install:browsers

      - name: Run E2E Tests
        working-directory: tests/e2e
        run: npm run test:e2e

      - name: Pack and smoke test local package
        shell: pwsh
        run: |
          ./scripts/smoke-test-local-package.ps1 -Pack -PackageVersion "${{ inputs.package_version }}"

      - name: Authenticate to GitHub Packages
        run: >
          dotnet nuget add source
          --username "${{ github.actor }}"
          --password "${{ secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text
          --name github
          "https://nuget.pkg.github.com/ashpeterson/index.json"

      - name: Publish runtime package to GitHub Packages
        run: >
          dotnet nuget push
          "src/AgentBlazor.Components/bin/Release/AgentBlazor.${{ inputs.package_version }}.nupkg"
          --source "https://nuget.pkg.github.com/ashpeterson/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
          --timeout 120

      - name: Publish CLI tool package to GitHub Packages
        run: >
          dotnet nuget push
          "src/AgentBlazor.Cli/bin/Release/AgentBlazor.Cli.${{ inputs.package_version }}.nupkg"
          --source "https://nuget.pkg.github.com/ashpeterson/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
          --timeout 120

      - name: Upload published package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentblazor-packages-${{ inputs.package_version }}
          path: |
            src/AgentBlazor.Components/bin/Release/AgentBlazor.${{ inputs.package_version }}.nupkg
            src/AgentBlazor.Cli/bin/Release/AgentBlazor.Cli.${{ inputs.package_version }}.nupkg
          if-no-files-found: error
