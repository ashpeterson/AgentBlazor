name: external-chat-widget-matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  external-chat-widget:
    name: external-chat-widget (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: fresh-blazor-no-provider
            external_template: blazor
            external_repo: ""
            external_ref: ""
            external_project: AgentBlazorExternalTemplate.csproj
            external_app_path: /
            external_provider_mode: none
            external_chat_surfaces: widget,surface,panel,bar
            external_chat_surfaces_path: /agentblazor-chat-surfaces
          - name: fresh-blazor-deterministic
            external_template: blazor
            external_repo: ""
            external_ref: ""
            external_project: AgentBlazorExternalTemplate.csproj
            external_app_path: /
            external_provider_mode: deterministic
            external_chat_surfaces: widget,surface,panel,bar
            external_chat_surfaces_path: /agentblazor-chat-surfaces
          - name: clean-architecture-deterministic
            external_template: ""
            external_repo: https://github.com/neozhu/CleanArchitectureWithBlazorServer.git
            external_ref: ""
            external_project: src/Server.UI/Server.UI.csproj
            external_app_path: /public/index
            external_provider_mode: deterministic
            external_chat_surfaces: widget
            external_chat_surfaces_path: /agentblazor-chat-surfaces
          - name: clean-architecture-authenticated-users
            external_template: ""
            external_repo: https://github.com/neozhu/CleanArchitectureWithBlazorServer.git
            external_ref: ""
            external_project: src/Server.UI/Server.UI.csproj
            external_app_path: /identity/users
            external_provider_mode: deterministic
            external_chat_surfaces: widget,surface,panel,bar
            external_chat_surfaces_path: /agentblazor-chat-surfaces
            external_login_path: /pages/authentication/login?ReturnUrl=%2Fidentity%2Fusers
            external_login_username: administrator
            external_login_password: Password123!
            external_expected_text: Users

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK (pinned)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Restore
        run: dotnet restore AgentBlazor.slnx --force-evaluate

      - name: Build
        run: dotnet build AgentBlazor.slnx -c Release --no-restore -nologo

      - name: Install E2E Dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: tests/e2e
        run: npm run install:browsers

      - name: Run External Chat Widget Validation
        env:
          AGENTBLAZOR_EXTERNAL_TEMPLATE: ${{ matrix.target.external_template }}
          AGENTBLAZOR_EXTERNAL_REPO: ${{ matrix.target.external_repo }}
          AGENTBLAZOR_EXTERNAL_REF: ${{ matrix.target.external_ref }}
          AGENTBLAZOR_EXTERNAL_PROJECT: ${{ matrix.target.external_project }}
          AGENTBLAZOR_EXTERNAL_APP_PATH: ${{ matrix.target.external_app_path }}
          AGENTBLAZOR_EXTERNAL_PROVIDER_MODE: ${{ matrix.target.external_provider_mode }}
          AGENTBLAZOR_EXTERNAL_CHAT_SURFACES: ${{ matrix.target.external_chat_surfaces }}
          AGENTBLAZOR_EXTERNAL_CHAT_SURFACES_PATH: ${{ matrix.target.external_chat_surfaces_path }}
          AGENTBLAZOR_EXTERNAL_LOGIN_PATH: ${{ matrix.target.external_login_path }}
          AGENTBLAZOR_EXTERNAL_LOGIN_USERNAME: ${{ matrix.target.external_login_username }}
          AGENTBLAZOR_EXTERNAL_LOGIN_PASSWORD: ${{ matrix.target.external_login_password }}
          AGENTBLAZOR_EXTERNAL_EXPECTED_TEXT: ${{ matrix.target.external_expected_text }}
        run: npm --prefix tests/e2e run test:external-chat-widget

      - name: Upload External Chat Widget Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-chat-widget-${{ matrix.target.name }}-artifacts
          path: tests/e2e/artifacts/external-chat-widget/**
          if-no-files-found: warn
