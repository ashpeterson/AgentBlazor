name: external-chat-widget

on:
  workflow_dispatch:
    inputs:
      package_source_mode:
        description: "Package source mode: local packs current source, published installs from GitHub Packages"
        required: false
        default: "local"
      package_version:
        description: "AgentBlazor package version to install; defaults to Directory.Build.props version"
        required: false
        default: ""
      external_repo:
        description: "External Blazor repository to clone"
        required: false
        default: "https://github.com/damienbod/BlazorSecurityNet10.git"
      external_template:
        description: "Optional dotnet template target to generate instead of cloning, for example: blazor"
        required: false
        default: ""
      external_ref:
        description: "Optional branch, tag, or commit"
        required: false
        default: ""
      external_project:
        description: "Project path inside the external repository"
        required: false
        default: ""
      external_app_path:
        description: "Route to open for browser widget assertions"
        required: false
        default: "/"
      external_provider_mode:
        description: "Provider mode for widget assertions: none or deterministic"
        required: false
        default: "none"
      external_chat_surfaces:
        description: "Comma-separated chat surfaces to validate: widget,surface,panel,bar"
        required: false
        default: "widget,surface,panel,bar"
      external_chat_surfaces_path:
        description: "Route used for the temporary embedded chat surfaces harness"
        required: false
        default: "/agentblazor-chat-surfaces"
      external_expected_text:
        description: "Optional text that must be visible on the external app page before widget assertions"
        required: false
        default: ""
      external_login_path:
        description: "Optional login path for authenticated external apps"
        required: false
        default: ""
      external_login_username:
        description: "Optional login username for authenticated external apps"
        required: false
        default: ""
      external_login_password:
        description: "Optional login password for authenticated external apps"
        required: false
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  external-chat-widget:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK (pinned)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Restore
        run: dotnet restore AgentBlazor.slnx --force-evaluate

      - name: Build
        run: dotnet build AgentBlazor.slnx -c Release --no-restore -nologo

      - name: Install E2E Dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: tests/e2e
        run: npm run install:browsers

      - name: Run External Chat Widget Validation
        env:
          AGENTBLAZOR_PACKAGE_SOURCE_MODE: ${{ inputs.package_source_mode }}
          AGENTBLAZOR_PACKAGE_VERSION: ${{ inputs.package_version }}
          AGENTBLAZOR_GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          AGENTBLAZOR_GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENTBLAZOR_EXTERNAL_REPO: ${{ inputs.external_repo }}
          AGENTBLAZOR_EXTERNAL_TEMPLATE: ${{ inputs.external_template }}
          AGENTBLAZOR_EXTERNAL_REF: ${{ inputs.external_ref }}
          AGENTBLAZOR_EXTERNAL_PROJECT: ${{ inputs.external_project }}
          AGENTBLAZOR_EXTERNAL_APP_PATH: ${{ inputs.external_app_path }}
          AGENTBLAZOR_EXTERNAL_PROVIDER_MODE: ${{ inputs.external_provider_mode }}
          AGENTBLAZOR_EXTERNAL_CHAT_SURFACES: ${{ inputs.external_chat_surfaces }}
          AGENTBLAZOR_EXTERNAL_CHAT_SURFACES_PATH: ${{ inputs.external_chat_surfaces_path }}
          AGENTBLAZOR_EXTERNAL_EXPECTED_TEXT: ${{ inputs.external_expected_text }}
          AGENTBLAZOR_EXTERNAL_LOGIN_PATH: ${{ inputs.external_login_path }}
          AGENTBLAZOR_EXTERNAL_LOGIN_USERNAME: ${{ inputs.external_login_username }}
          AGENTBLAZOR_EXTERNAL_LOGIN_PASSWORD: ${{ inputs.external_login_password }}
        run: npm --prefix tests/e2e run test:external-chat-widget

      - name: Upload External Chat Widget Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-chat-widget-artifacts
          path: tests/e2e/artifacts/external-chat-widget/**
          if-no-files-found: warn
