name: real-usability-nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  real-usability:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK (pinned)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Validate Live Provider Configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ] && [ -z "${OLLAMA_MODEL}" ]; then
            echo "::error::real-usability-nightly requires OPENAI_API_KEY secret or OLLAMA_MODEL repository variable."
            exit 1
          fi
          if [ -n "${OPENAI_API_KEY}" ] && [[ "${OPENAI_API_KEY}" != sk-* ]]; then
            echo "::error::OPENAI_API_KEY is set but does not look like an OpenAI API key. It should start with 'sk-'."
            exit 1
          fi

      - name: Restore
        run: dotnet restore AgentBlazor.slnx --locked-mode

      - name: Build
        run: dotnet build AgentBlazor.slnx -c Release --no-restore -nologo

      - name: Restore Demo For E2E
        run: >
          dotnet restore
          demo/AgentBlazor.Demo/AgentBlazor.Demo.csproj
          --force-evaluate
          -p:RuntimeIdentifier=linux-x64

      - name: Build Demo For E2E
        run: >
          dotnet build
          demo/AgentBlazor.Demo/AgentBlazor.Demo.csproj
          -c Release
          --no-restore
          -nologo
          -p:RuntimeIdentifier=linux-x64

      - name: Install E2E Dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: tests/e2e
        run: npm run install:browsers

      - name: Run Real Usability Suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OpenAI__Model: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
          OLLAMA_ENDPOINT: ${{ vars.OLLAMA_ENDPOINT }}
        run: npm --prefix tests/e2e run test:real-usability

      - name: Upload Real Usability Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-usability-artifacts
          path: tests/e2e/artifacts/real-usability/**
          if-no-files-found: warn
